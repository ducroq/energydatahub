name: Collect and Publish Data

on:
  schedule:
    - cron: '0 16 * * *'  # Runs daily at 16:00 UTC (18:00 CET / 20:00 CEST)
  workflow_dispatch:  # Allows manual triggering

# Serialize Pages deployments so a retrying deploy never races a later run.
# cancel-in-progress: false — never kill an in-flight data collection.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        fetch-depth: 0  # Fetch all history for all branches and tags
        token: ${{ secrets.PAT }}  # Personal Access Token (PAT) with repo scope

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create data directory
      run: mkdir -p data

    - name: Collect data
      env:
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        HMAC_KEY: ${{ secrets.HMAC_KEY }}
        ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        # GoogleWeatherCollector was disabled 2026-06-05 (replaced by
        # Open-Meteo). The secret is retained as a cold-revert option;
        # if Google Weather will not be revived, delete the secret from
        # the GH Actions secret store and this env line.
        GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}
        TENNET_API_KEY: ${{ secrets.TENNET_API_KEY }}
        NED_API_KEY: ${{ secrets.NED_API_KEY }}
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        GIE_API_KEY: ${{ secrets.GIE_API_KEY }}

      run: python data_fetcher.py

    # Soft tripwire: warn (don't fail) when an expected output JSON is missing.
    # Surfaces silent collector dropouts in the Actions run summary without
    # blocking publish — the hard gate is the next step. Always runs so we
    # still get visibility when a later step fails.
    - name: Verify expected output files
      if: always()
      run: |
        expected=(
          energy_price_forecast weather_forecast_multi_location weather_forecast_buurt
          grid_imbalance wind_forecast ned_production solar_forecast solar_forecast_buurt
          demand_weather_forecast air_quality_buurt cross_border_flows load_forecast
          generation_forecast generation_mix nordic_hydro calendar_features market_proxies
          market_history gas_storage gas_flows
        )
        missing=0
        for f in "${expected[@]}"; do
          if [ ! -f "data/${f}.json" ]; then
            echo "::warning::MISSING: data/${f}.json"
            missing=$((missing + 1))
          fi
        done
        present=$(( ${#expected[@]} - missing ))
        echo "Data completeness: ${present}/${#expected[@]} files present"

    # Defensive: fail the workflow loudly if data_quality_report flags any
    # dataset as `critical`. Added 2026-06-05 after the GoogleWeatherCollector
    # silent-failure incident (7 months of `API_KEY_INVALID` while the
    # workflow happily exited 0). Gate placed *before* the docs/commit/push
    # steps so degraded data is never published downstream.
    - name: Assert data quality (no silent failures)
      run: |
        if [ ! -f data/data_quality_report.json ]; then
          echo "::error::data/data_quality_report.json is missing — data_fetcher.py did not produce a quality report"
          exit 1
        fi
        status=$(jq -r '.overall_status // "missing"' data/data_quality_report.json)
        echo "data_quality_report.overall_status = $status"
        if [ "$status" = "critical" ]; then
          echo "::error::Aborting publish — overall_status is critical. Failing datasets:"
          jq '.dataset_reports[] | select(.status == "critical") | {dataset_name, status, issues}' data/data_quality_report.json
          exit 1
        fi

    # Schema-drift tripwire (#27 Layer A). Compares the new
    # data/_shape_signatures.json against the last committed version (HEAD,
    # which at this point is still the previous successful publish — we
    # haven't committed today's run yet). If a feed's shape changed but
    # CURRENT_SCHEMA_VERSION did not move, the next class of bug behind
    # PR #20 and #26 is happening — fail the workflow loudly.
    #
    # IMPORTANT: `--previous-ref HEAD` is intentional, not a typo for
    # HEAD~1. This step runs BEFORE the "Commit and push if changed" step
    # below, so HEAD at this point is still yesterday's daily commit.
    # The freshly-written sidecar in the working tree is "current". If
    # you move this step to run AFTER the commit (where HEAD becomes
    # today's commit), switch the flag to `--previous-ref HEAD~1`.
    #
    # Fail-mode: any within-feed shape drift without a CURRENT_SCHEMA_VERSION
    # bump aborts the run. Re-add --warn-only to re-enter the bedding-in
    # period if a new false-positive class emerges.
    #
    # `if: success()` (the default): the drift comparison is only meaningful
    # after a clean collection + quality gate. On a failed "Collect data" run
    # this step would otherwise diff the stale checked-out sidecar against
    # itself — benign but noisy. Unlike the completeness tripwire above, this
    # one has no diagnostic value on the failure path.
    # #43: commit the learning record BEFORE the tripwire can fail the job.
    # data/_shape_signatures.json is the tripwire's BASELINE and must only
    # advance on a passing run, or a broken shape becomes the new normal.
    # data/_shape_observations.jsonl is the append-only HISTORY the volatility
    # classifier learns from. It records every run that reaches this step —
    # which is the drift-tripwire failures this was built for, but NOT runs
    # that died in collection or the quality gate (`if: success()` skips those).
    # Committing it after the tripwire is precisely why ned_production and
    # wind_forecast failed on 2026-08-03 and were still unclassified five days
    # later — the classifier could only ever learn from its own near-misses.
    # This commit deliberately stages ONLY the .jsonl, so `git show HEAD:` in
    # the tripwire below still resolves to the previous sidecar.
    # continue-on-error: this record is a diagnostic. data_fetcher deliberately
    # never fails a run over it, and neither should CI — a push race here must
    # not cost a day's publish. Without this, a rejected push aborts the drift
    # check, the data commit, and the Pages deploy.
    - name: Commit shape observation (learning record)
      if: success()
      continue-on-error: true
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        # Guard the add: data_fetcher swallows an OSError when writing this
        # file, so it can legitimately be absent, and `git add` on a missing
        # pathspec exits 128 under bash -e.
        if [ -f data/_shape_observations.jsonl ]; then
          git add -f data/_shape_observations.jsonl
          git diff --staged --quiet || (git commit -m "Record shape observation" && git push)
        else
          echo "::warning::no shape observation written this run — classifier learns nothing"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}

    - name: Schema-drift tripwire
      if: success()
      run: |
        python scripts/detect_schema_drift.py \
          --previous-ref HEAD

    # Span (time-extent) check (#53; the incident that exposed it is #51).
    # NOT a gate — always exits 0, and runs
    # `if: always()` so it still reports when the drift tripwire above has
    # already failed the job. A feed can lose half its forecast horizon with an
    # IDENTICAL shape hash (96 records and 192 records hash the same), which is
    # how load_forecast shipped 1 day instead of 2 for four publishes with
    # every gate green. This is the fourth gate in the
    # {presence, structure, span, values} set; the other three existed.
    #
    # Deliberately non-blocking: the drift tripwire's only response to a
    # problem is withholding all 20 feeds, that cost five consecutive publishes
    # on 2026-08-31..09-03, and stacking a second blocking gate would cost more
    # availability than this detection is worth. The alert below is the
    # response instead.
    - name: Span shortfall check
      id: span
      if: always()
      run: python scripts/report_span_shortfall.py

    # Raise a SEPARATE tracking issue from the publish-failure one. A degraded
    # span and a failed publish are different conditions with different
    # remedies, and one issue collecting both would make neither readable.
    # Same dedup mechanics as the alert job: label, filtered client-side off
    # the unfiltered list, because both `--search` and `--label` are
    # eventually consistent and duplicated the issue on back-to-back runs
    # (measured 2026-09-04).
    # Only the SCHEDULED run raises the alarm; the reporter above still runs
    # and logs on every trigger. A manual dispatch before the day-ahead auction
    # clears (~12:00 CET) genuinely IS short on the price feeds — measured on
    # both of 2026-09-04's dispatches, which carried entsoe at 1 day instead of
    # 2 — so alerting on it would be TRUE and useless, and a predictable
    # recurring false alarm is how an alarm stops being read. The scheduled run
    # is post-auction and is the one whose span means anything.
    - name: Alert on span shortfall
      if: always() && github.event_name == 'schedule' && steps.span.outputs.checked == 'true' && steps.span.outputs.shortfalls != '0'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.PAT }}
        GH_REPO: ${{ github.repository }}
        SPAN_LABEL: span-shortfall
        SPAN_TITLE: 'A feed is short of its usual time span'
        SUMMARY: ${{ steps.span.outputs.summary }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        body=$(printf '%s\n' \
          "One or more feeds published FEWER days than they normally carry. The shape-drift tripwire cannot see this — a feed at half its horizon hashes identically to a healthy one (#53)." \
          "" \
          "\`\`\`" \
          "${SUMMARY}" \
          "\`\`\`" \
          "" \
          "Run: ${RUN_URL}" \
          "" \
          "This is an alarm, not a gate — the publish went ahead. Check whether the upstream source has changed its publication horizon before assuming a collector bug. This issue closes automatically once every member carries its usual span again.")
        gh label create "$SPAN_LABEL" --description "Automated: a feed is short of its usual time span (#53)" --color D93F0B 2>/dev/null || true
        existing=$(gh issue list --state open --limit 200 --json number,labels \
          --jq "[.[] | select(any(.labels[]; .name == env.SPAN_LABEL))] | .[0].number // empty") \
          || { echo "::error::span alerting: could not query issues — the shortfall went unrecorded"; exit 1; }
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body "$body" \
            || { echo "::error::span alerting: could not comment on #${existing}"; exit 1; }
          echo "::warning::Span shortfall persists — commented on issue #${existing}"
        else
          url=$(gh issue create --title "$SPAN_TITLE" --body "$body" --label "$SPAN_LABEL") \
            || { echo "::error::span alerting: could not open the shortfall issue"; exit 1; }
          echo "::warning::Span shortfall — opened ${url}"
        fi

    - name: Close the span-shortfall issue on recovery
      if: always() && steps.span.outputs.checked == 'true' && steps.span.outputs.shortfalls == '0'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.PAT }}
        GH_REPO: ${{ github.repository }}
        SPAN_LABEL: span-shortfall
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        existing=$(gh issue list --state open --limit 200 --json number,labels \
          --jq "[.[] | select(any(.labels[]; .name == env.SPAN_LABEL))] | .[0].number // empty") \
          || { echo "::error::span alerting: could not query issues — a stale shortfall issue may still be open"; exit 1; }
        if [ -n "$existing" ]; then
          gh issue close "$existing" --comment "Every member is back to its usual span — ${RUN_URL}." \
            || { echo "::error::span alerting: could not close #${existing}"; exit 1; }
          echo "::notice::Spans recovered; closed issue #${existing}"
        fi

    - name: Prepare docs folder with only current data
      run: |
        mkdir -p docs
        # Copy files that exist, skip missing ones
        for file in energy_price_forecast.json weather_forecast_multi_location.json weather_forecast_buurt.json grid_imbalance.json wind_forecast.json ned_production.json solar_forecast.json solar_forecast_buurt.json demand_weather_forecast.json air_quality_buurt.json cross_border_flows.json load_forecast.json generation_forecast.json generation_mix.json nordic_hydro.json calendar_features.json market_proxies.json market_history.json gas_storage.json gas_flows.json; do
          if [ -f "data/$file" ]; then
            cp "data/$file" docs/
            echo "Copied $file"
          else
            echo "Skipping missing file: $file"
          fi
        done
        # Copy log files if they exist
        if ls data/*.log 1> /dev/null 2>&1; then
          cp data/*.log docs/
        fi

    # - name: List contents of data and docs directories
    #   run: |
    #     echo "Contents of data directory:"
    #     ls -la data/
    #     echo "Contents of docs directory:"
    #     ls -la docs/

    - name: Commit and push if changed
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add -f data/*.json docs/*.json
        git status
        git diff --staged --name-status
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update energy data" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}

    - name: Trigger dashboard rebuild
      run: |
        curl -X POST -d {} ${{ secrets.NETLIFY_BUILD_HOOK }}
      continue-on-error: true

    # Package docs/ as the Pages artifact. Pages source is "GitHub Actions"
    # (switched from "Deploy from a branch" on 2026-07-06) so the deploy job
    # below can retry transient GitHub-side deploy failures — which the
    # auto-generated pages-build-deployment workflow could not.
    - name: Configure Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      with:
        path: docs

  # Deploy the docs/ artifact to GitHub Pages with a bounded retry. The
  # actions/deploy-pages step occasionally returns "Deployment failed, try
  # again later." — a transient GitHub-side fault (observed 2026-07-05).
  # Three attempts, each a fresh deployment of the same artifact, with a
  # short backoff. environment.url takes whichever attempt succeeded.
  deploy:
    needs: collect-and-publish
    runs-on: ubuntu-latest
    permissions:
      pages: write       # deploy to Pages
      id-token: write     # OIDC token for deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages (attempt 1)
      id: d1
      continue-on-error: true
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
    - name: Backoff before attempt 2
      if: steps.d1.outcome == 'failure'
      run: sleep 60
    - name: Deploy to GitHub Pages (attempt 2)
      id: d2
      if: steps.d1.outcome == 'failure'
      continue-on-error: true
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
    - name: Backoff before attempt 3
      if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
      run: sleep 120
    - name: Deploy to GitHub Pages (attempt 3, final)
      id: d3
      if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

    # - name: Verify deployment
    #   run: |
    #     echo "Current directory:"
    #     pwd
    #     echo "Contents of current directory:"
    #     ls -la
    #     echo "Contents of docs directory:"
    #     ls -la docs/

  # Alerting (#50). The 2026-08-31..09-03 window lost five consecutive
  # publishes and ran four days before anyone noticed: a failed scheduled run
  # is silent unless someone opens the Actions tab, and GitHub's cron-failure
  # email goes only to the account that last touched the workflow file — not a
  # channel anybody here watches. (Of those five, the drift tripwire blocked
  # three; the other two died earlier, in "Collect data". The gate was not the
  # whole story — the missing alarm was.)
  #
  # `needs` BOTH jobs so this covers both failure surfaces: collect-and-publish
  # dying at a tripwire, and the Pages deploy failing after a clean collection.
  # A skipped deploy (which is what happens when collection fails) reads as
  # not-'success' and is caught by the same condition.
  #
  # ONE tracking issue, commented per failure — never a new issue per run. An
  # alert that files 30 issues a month is an alert nobody reads, which is the
  # state this exists to fix, not reproduce. The issue is the durable record a
  # run log is not: it outlives log retention, it is visible from the repo
  # landing page, and its comment thread answers "blip or streak?" at a glance.
  # It closes itself on the next fully successful run.
  #
  # GH_REPO is REQUIRED, not decoration. `gh` resolves its target repo from the
  # git remote of the working directory and does NOT read GITHUB_REPOSITORY;
  # this job deliberately has no actions/checkout (it needs no code), so its
  # workspace is empty and every gh call would die with "fatal: not a git
  # repository". Combined with continue-on-error that produced a green job that
  # alerted nobody — an alerting feature with this project's own three-incident
  # signature, caught in review on 2026-09-04 before it ever ran. Do not remove
  # GH_REPO, and do not add a checkout to work around its absence.
  #
  # continue-on-error keeps alerting from deciding the pipeline's verdict — a
  # failed publish must stay failed even if the alert cannot be filed. But the
  # gh calls are explicitly wrapped to emit ::error:: on failure, because a
  # silent alerter is indistinguishable from a healthy pipeline, which is the
  # exact bug class above.
  #
  # `!cancelled()` rather than `always()`: a cancelled run leaves both results
  # as 'cancelled', which is != 'success', so `always()` would file a false
  # alarm every time someone hits Cancel.
  alert:
    needs: [collect-and-publish, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}          # authenticates with the PAT; GITHUB_TOKEN unused
    env:
      GH_TOKEN: ${{ secrets.PAT }}
      GH_REPO: ${{ github.repository }}
      TITLE: 'Daily publish is failing'
      LABEL: publish-failure
    steps:
    - name: Open or update the publish-failure issue
      if: needs.collect-and-publish.result != 'success' || needs.deploy.result != 'success'
      continue-on-error: true
      env:
        COLLECT_RESULT: ${{ needs.collect-and-publish.result }}
        DEPLOY_RESULT: ${{ needs.deploy.result }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        body=$(printf '%s\n' \
          "Publish did not complete — \`docs/\` was not updated, so downstream consumers (Augur) are reading a stale vintage." \
          "" \
          "| | |" \
          "|---|---|" \
          "| Run | ${RUN_URL} |" \
          "| Trigger | ${GITHUB_EVENT_NAME} |" \
          "| collect-and-publish | ${COLLECT_RESULT} |" \
          "| deploy | ${DEPLOY_RESULT} |" \
          "" \
          "This issue closes automatically on the next fully successful run.")
        # Dedup by label, filtered CLIENT-SIDE off the unfiltered issue list.
        # Both server-side filters were measured non-viable on 2026-09-04:
        # `--search "... in:title"` goes through GitHub's search index and
        # `--label` through its own filter, and BOTH lagged an issue that had
        # just been created (~4s). The unfiltered list returned it immediately,
        # twice. Since consecutive failing runs are normally 24h apart the lag
        # is usually invisible — but a re-run or a manual dispatch straight
        # after a failed schedule is exactly the back-to-back case, and it
        # would open a duplicate issue every time.
        #
        # Label rather than title so renaming the issue does not break dedup;
        # --limit 200 against ~21 open issues has ample headroom.
        #
        # Worth knowing HOW this was found: five review passes read the
        # --search version, one of them explicitly "verified" the query, and
        # none caught it — they all tested against an already-indexed issue.
        # A six-line smoke test that created one first caught it on the first
        # run. For anything that talks to an external API, run it.
        gh label create "$LABEL" --description "Automated: daily publish is failing (#50)" \
          --color B60205 2>/dev/null || true
        existing=$(gh issue list --state open --limit 200 --json number,labels \
          --jq "[.[] | select(any(.labels[]; .name == env.LABEL))] | .[0].number // empty") \
          || { echo "::error::alerting: could not query issues — the publish-failure alert did NOT fire"; exit 1; }
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body "$body" \
            || { echo "::error::alerting: could not comment on issue #${existing} — this failure went unrecorded"; exit 1; }
          echo "::warning::Publish still failing — commented on issue #${existing}"
        else
          url=$(gh issue create --title "$TITLE" --body "$body" --label "$LABEL") \
            || { echo "::error::alerting: could not open the publish-failure issue — this failure went unrecorded"; exit 1; }
          echo "::warning::Publish failing — opened ${url}"
        fi

    - name: Close the publish-failure issue on recovery
      if: needs.collect-and-publish.result == 'success' && needs.deploy.result == 'success'
      continue-on-error: true
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        existing=$(gh issue list --state open --limit 200 --json number,labels \
          --jq "[.[] | select(any(.labels[]; .name == env.LABEL))] | .[0].number // empty") \
          || { echo "::error::alerting: could not query issues — a stale publish-failure issue may still be open"; exit 1; }
        if [ -n "$existing" ]; then
          gh issue close "$existing" --comment "Recovered — publish succeeded in ${RUN_URL}." \
            || { echo "::error::alerting: could not close issue #${existing} — it will now collect comments from unrelated future failures"; exit 1; }
          echo "::notice::Publish recovered; closed issue #${existing}"
        fi
